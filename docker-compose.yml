# One command: docker compose up --build
# Starts Postgres (auto-creates the DB), API (auto-runs migrations), voice agent, frontend.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Pakistan@12345"
      POSTGRES_DB: Universities_Voice_Agent   # created automatically on first start
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Universities_Voice_Agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend/api
    env_file:
      - ./backend/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Pakistan%4012345@postgres:5432/Universities_Voice_Agent
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      SEED: demo   # demo | sdsu | none
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build: ./backend/my-agent
    env_file:
      - ./backend/my-agent/.env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Pakistan%4012345@postgres:5432/Universities_Voice_Agent
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
